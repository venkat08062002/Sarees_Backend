spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sarees_ecommerce}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.sarees.ecommerce: INFO

app:
  jwt:
    secret: ${JWT_SECRET:change-me-use-at-least-32-characters-secret-key-here}
    access-token-expiration-seconds: ${JWT_ACCESS_EXPIRATION:3600}
    refresh-token-expiration-seconds: ${JWT_REFRESH_EXPIRATION:604800}
  security:
    password-reset-url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
    password-reset-expiration-minutes: 15
