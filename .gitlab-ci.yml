stages:
  - build
  - test
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  paths:
    - .m2/repository

build:
  stage: build
  image: eclipse-temurin:21
  script:
    - ./mvnw -B clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar

test:
  stage: test
  image: eclipse-temurin:21
  script:
    - ./mvnw -B test
